<div style="overflow-y: hidden; overflow-x: hidden;">
    <h2 mat-dialog-title>Delete Project</h2>

    <mat-dialog-content >
        Are you sure you want to delete this project? The Analytics will no longer be available after deletion.
    </mat-dialog-content>

    <mat-dialog-actions>
        <button class="btn btn-primary" style="margin-right:30px;margin-bottom:30px" (click)="performDelete()" [disabled]="buttonDisabled">Confirm</button>
        <button class="btn btn-secondary" style="margin-left:10px;margin-bottom:30px" (click)="close()" >Cancel</button>
    </mat-dialog-actions>
</div>
